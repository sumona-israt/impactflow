# Single origin, path-based routing: keeps the Next.js frontend and the
# Laravel API on the same registrable origin so Sanctum's cookie-based SPA
# auth works without CORS/SameSite workarounds (see docs/architecture.md §3).
server {
    listen 80;
    server_name _;
    client_max_body_size 25m;
    root /var/www/html/public;
    index index.php;

    # Baseline hardening (see docs/implementation-plan.md Phase 9). CSP and
    # HSTS are deliberately not set here: CSP needs a real content policy
    # tuned to the frontend's actual script/style sources, and HSTS is
    # meaningless without TLS termination in front of this compose file —
    # both are follow-up work, not silently skipped.
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Laravel API + Sanctum CSRF bootstrap. try_files' fallback to
    # /index.php is an internal redirect that re-runs location matching from
    # scratch, so the `\.php$` handler below MUST be a top-level location
    # (nesting it here would put it out of reach of that fresh lookup).
    location ~ ^/(api|sanctum) {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Laravel-served static assets (build assets only — the `storage` disk
    # is never web-served, see backend/config/filesystems.php)
    location ~ ^/(storage|build) {
        try_files $uri =404;
    }

    # Everything else goes to the Next.js frontend
    location / {
        proxy_pass http://nextjs:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ \.php$ {
        fastcgi_pass laravel:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }
}
