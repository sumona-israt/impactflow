name: impactflow

services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${APP_PORT:-80}:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - laravel_public:/var/www/html/public:ro
    depends_on:
      laravel:
        condition: service_healthy
      nextjs:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  laravel:
    build:
      context: ./backend
      dockerfile: ../docker/php/Dockerfile
    env_file:
      - ./backend/.env
    environment:
      DB_HOST: postgres
      REDIS_HOST: redis
    volumes:
      - laravel_storage:/var/www/html/storage
      - laravel_public:/var/www/html/public
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php", "artisan", "--version"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s

  worker:
    build:
      context: ./backend
      dockerfile: ../docker/php/Dockerfile
    command: php artisan queue:work --sleep=3 --tries=3 --max-time=3600
    env_file:
      - ./backend/.env
    environment:
      DB_HOST: postgres
      REDIS_HOST: redis
    volumes:
      - laravel_storage:/var/www/html/storage
    depends_on:
      laravel:
        condition: service_healthy
    restart: unless-stopped

  scheduler:
    build:
      context: ./backend
      dockerfile: ../docker/php/Dockerfile
    command: php artisan schedule:work
    env_file:
      - ./backend/.env
    environment:
      DB_HOST: postgres
      REDIS_HOST: redis
    volumes:
      - laravel_storage:/var/www/html/storage
    depends_on:
      laravel:
        condition: service_healthy
    restart: unless-stopped

  nextjs:
    build:
      context: ./frontend
      dockerfile: ../docker/nextjs/Dockerfile
    env_file:
      - ./frontend/.env
    healthcheck:
      # "localhost" can resolve to ::1 first, which nothing is listening on
      # (the server binds IPv4 0.0.0.0 only) — force IPv4 explicitly.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_DATABASE:-impactflow}
      POSTGRES_USER: ${DB_USERNAME:-impactflow}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    ports:
      # exposed to the host so `php artisan` run locally (outside Docker, via
      # Homebrew PHP) can iterate against the same database (docs/architecture.md §5)
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-impactflow}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
  laravel_storage:
  laravel_public:
