name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  backend:
    name: Backend (Lint + Test)
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: pdo_sqlite, pdo_pgsql, redis, bcmath, zip, intl, mbstring
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: backend/vendor
          key: composer-${{ hashFiles('backend/composer.lock') }}

      - name: Install dependencies
        working-directory: backend
        run: composer install --prefer-dist --no-progress

      - name: Copy environment file
        working-directory: backend
        run: cp .env.example .env && php artisan key:generate

      - name: Check code style (Pint)
        working-directory: backend
        run: ./vendor/bin/pint --test

      - name: Run tests (Pest)
        working-directory: backend
        run: ./vendor/bin/pest

  frontend:
    name: Frontend (Lint + Type-check + Build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Type-check
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Build
        working-directory: frontend
        run: npm run build

  docker-smoke-test:
    name: Docker Compose smoke test
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Prepare environment files
        run: |
          cp .env.example .env
          cp backend/.env.example backend/.env
          cp frontend/.env.example frontend/.env
          sed -i "s/^APP_KEY=.*/APP_KEY=base64:$(openssl rand -base64 32)/" backend/.env

      - name: Build and start the stack
        run: docker compose up -d --build

      - name: Wait for the app to become healthy
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost/api/health; then exit 0; fi
            sleep 5
          done
          echo "Stack did not become healthy in time" >&2
          docker compose logs
          exit 1

      - name: Seed the database
        run: docker compose exec -T laravel php artisan migrate --seed --force

      # A health check alone would have missed the Phase 2 regression where
      # authenticated Server Components silently redirected every logged-in
      # user back to /login (Sanctum didn't recognize the server-to-server
      # call as a stateful frontend request — see docs/architecture.md §3).
      # This exercises the real cookie-session flow end-to-end through nginx.
      - name: Smoke-test the authenticated dashboard flow
        run: |
          set -e
          COOKIES=$(mktemp)
          xsrf() { python3 -c "import urllib.parse,sys; print(urllib.parse.unquote(sys.argv[1]))" "$(grep XSRF-TOKEN "$COOKIES" | awk '{print $7}')"; }

          curl -sf -c "$COOKIES" -b "$COOKIES" http://localhost/sanctum/csrf-cookie -o /dev/null

          curl -sf -c "$COOKIES" -b "$COOKIES" -X POST http://localhost/api/v1/login \
            -H "Content-Type: application/json" -H "Accept: application/json" \
            -H "X-XSRF-TOKEN: $(xsrf)" -H "Referer: http://localhost/" \
            -d '{"email":"admin@impactflow.test","password":"password"}' -o /dev/null

          STATUS=$(curl -s -o /tmp/dashboard.html -w "%{http_code}" -b "$COOKIES" http://localhost/dashboard)
          if [ "$STATUS" != "200" ] || grep -q "NEXT_REDIRECT" /tmp/dashboard.html; then
            echo "Authenticated /dashboard did not render (status $STATUS)" >&2
            cat /tmp/dashboard.html
            exit 1
          fi

      - name: Tear down
        if: always()
        run: docker compose down -v
